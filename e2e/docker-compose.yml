name: man10itembank-e2e

services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: itembank
      MYSQL_USER: itembank
      MYSQL_PASSWORD: itembank
    # 移行前のスキーマと重複行を投入する
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    # 開発機の既存MySQL(3306)とぶつからないようにする
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uitembank -pitembank --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  paper:
    image: itzg/minecraft-server:java21-graalvm
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      # 開発機の検証サーバーと同じ構成に合わせる
      VERSION: "1.21.8"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "e2e"
      # 起動を軽くする
      LEVEL_TYPE: "FLAT"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
      SPAWN_ANIMALS: "FALSE"
      SPAWN_MONSTERS: "FALSE"
      SPAWN_NPCS: "FALSE"
    volumes:
      - ./data:/data
    ports:
      - "25599:25565"
    depends_on:
      mysql:
        condition: service_healthy
