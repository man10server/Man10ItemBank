mysql:
  host:
  db:
  user:
  pass:
  port: 3306

  # trueにするとTLSを必須にする(sslMode=REQUIRED)
  # falseの場合、認証情報とアイテムデータが平文で流れるため、DBが別ホストなら有効化を推奨
  useSsl: false
  # useSsl: false かつ caching_sha2_password を使う場合に必要
  allowPublicKeyRetrieval: true

  # デッドロック/ロック待ちタイムアウト時の再試行回数(0-5)
  # ロールバックが保証されるエラーのみ再試行するため、二重適用は起きない
  maxRetry: 2

  # 起動時にスキーマを自動で整える。
  #   1. db.sql が定義するテーブルのうち、無いものだけを作成する(既存のテーブルには触らない)
  #   2. item_storage のスキーマ移行(重複行の統合とUNIQUE制約の付与)
  # 各手順は実行前に必要性を確認するため、何度起動しても結果は変わらない。
  # falseにした場合は確認のみ行い、対応が必要なら db.sql / db_migration_1.sql の
  # 手動実行を促して起動を中止する。
  autoMigrate: true

  pool:
    # 在庫処理スレッド + ログスレッド + 余裕
    maximumPoolSize: 6
    minimumIdle: 1
    # 接続確立の待ち時間
    connectionTimeoutMs: 5000
    # 応答待ちの上限。0にすると接続が黙って切れた際に永久にブロックするので0にしないこと
    socketTimeoutMs: 15000
    idleTimeoutMs: 300000
    maxLifetimeMs: 1200000
    validationTimeoutMs: 3000
    # この時間returnされないコネクションを警告する(0で無効)
    leakDetectionThresholdMs: 30000
